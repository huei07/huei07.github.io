<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>毎時アラーム</title>
<style>
body{font-family:sans-serif;max-width:700px;margin:20px auto;padding:20px;background:#222;color:#eee}
.flash{animation:f .5s 10}@keyframes f{50%{background:#665500}}
input,button{font-size:16px;padding:6px}#time{font-size:40px}#count{font-size:48px;color:#ff6}
</style></head><body>
<h2>毎時アラーム</h2>
<div>現在: <span id=time></span></div>
<div>次回: <span id=next></span></div>
<div>残り: <span id=remain></span></div>
<div>カウントダウン: <span id=count>-</span></div>
<p>通知する分:<input id=mins value="0,15,30,45"></p>
<p>音量:<input id=vol type=range min=0 max=100 value=80><span id=vp>80%</span></p>
<button id=start>開始</button><button id=stop>停止</button><button id=test>今すぐ鳴らす</button>
<script>
const $=id=>document.getElementById(id);
let run=false,last="";
mins.value=localStorage.mins||mins.value;vol.value=localStorage.vol||80;vp.textContent=vol.value+"%";
vol.oninput=()=>{vp.textContent=vol.value+"%";localStorage.vol=vol.value}
mins.onchange=()=>{let a=[...new Set(mins.value.split(",").map(x=>+x).filter(x=>x>=0&&x<60))].sort((a,b)=>a-b);mins.value=a.join(",");localStorage.mins=mins.value;}
const ctx=new (window.AudioContext||window.webkitAudioContext)();
async function beep(sec=0.15){
 if(ctx.state!="running") await ctx.resume();
 let o=ctx.createOscillator(),g=ctx.createGain();
 o.frequency.value=880;g.gain.value=vol.value/100*0.2;
 o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+sec);
}
async function alert5(){
 document.body.classList.add("flash");
 let end=Date.now()+5000;
 while(Date.now()<end){await beep();await new Promise(r=>setTimeout(r,500));}
 document.body.classList.remove("flash");
}
function calc(){
 let now=new Date(),arr=mins.value.split(",").map(Number).filter(n=>!isNaN(n));
 let best=null;
 for(let h=0;h<25;h++){
   for(let m of arr){
    let d=new Date(now);d.setHours(now.getHours()+h,m,0,0);
    if(d<=now)d.setHours(d.getHours()+1);
    if(!best||d<best)best=d;
   }
 }
 return best;
}
start.onclick=async()=>{run=true;await ctx.resume()}
stop.onclick=()=>run=false;
test.onclick=()=>alert5();
setInterval(()=>{
 let n=new Date();
 time.textContent=n.toLocaleTimeString();
 let nx=calc();
 next.textContent=nx.toLocaleTimeString();
 let diff=Math.floor((nx-n)/1000);
 remain.textContent=`${Math.floor(diff/60)}分${diff%60}秒`;
 count.textContent=(diff<=5&&diff>0)?diff:"-";
 let key=n.getHours()+":"+n.getMinutes();
 if(run&&n.getSeconds()==0&&mins.value.split(",").includes(String(n.getMinutes()))&&last!=key){last=key;alert5();}
},250);
</script></body></html>
